<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思跟读</title>
<meta name="description" content="剑桥雅思 5 阅读文章和写作范文逐句跟读，离线可用。">
<meta name="theme-color" content="#f5f3ee">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f5f3ee; --surface:#fffefb; --text:#1b1c21; --muted:#6a6c78; --faint:#9c9ea8; --line:#e3e0d7;
  --accent:#4a50c6; --accent-ink:#ffffff; --accent-soft:#e7e8fb; --accent-text:#3d43b3;
  --hl:#ffdf7e; --hl-ink:#1b1c21;
  --zh:#33364a;
  --shadow:0 1px 2px rgba(25,25,50,.06),0 6px 20px rgba(25,25,50,.07);
  --fs:19px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Noto Serif","Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* ---------- top bar（滚动后显示标题） ---------- */
.bar{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 14px) 16px 14px;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar h1{max-width:640px;margin:0 auto;font:italic 700 18px/1.2 var(--serif);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.bar.scrolled h1{opacity:1}

/* ---------- content ---------- */
main{max-width:640px;margin:0 auto;padding:0 16px calc(32px + var(--safe-b))}

/* 标题：和句子一样能点词、能整句朗读 */
.hero{padding:0 0 4px;scroll-margin:84px 0 40px}
.hero .ttl{margin:0 0 2px;font:italic 700 31px/1.3 var(--serif);letter-spacing:-.01em}
.hero .ttl .w .u{text-decoration-thickness:2px;text-underline-offset:7px}
.hero .foot{margin-top:2px}
.hero .zh{font-size:15px;color:var(--muted)}

.para{margin-top:24px}

/* 每句一张白色卡片：英文、下面是这句的中文，右下角小喇叭 */
.s{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px;
  margin:0 -10px 12px -8px;padding:12px 10px 6px 8px;border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);scroll-margin:84px 0 40px}
.s.cur::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent);transition:background-color .2s}
.num{padding-top:calc(var(--fs) * .42);text-align:right;font:600 12px/1 var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
.s.cur .num{color:var(--accent-text)}
.en{margin:0;font-family:var(--serif);font-size:var(--fs);line-height:1.7;overflow-wrap:break-word}
/* 每个词下面一条虚线：点词听读音，有对应中文的弹出小气泡 */
.w{cursor:pointer;border-radius:4px;transition:background-color .08s,color .08s,box-shadow .08s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w .u{text-decoration:underline dotted var(--faint);text-decoration-thickness:1.5px;text-underline-offset:5px}
.w.sel{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.w.sel .u{text-decoration-color:var(--accent)}
.w.on{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 2px var(--hl)}

.foot{display:flex;align-items:flex-end;gap:4px;margin-top:6px}
.zh{flex:1;margin:0 0 6px;color:var(--zh);font-size:max(15px,calc(var(--fs) - 3px));line-height:1.7}
.spk{flex:none;margin-right:-6px;height:40px;min-width:44px;padding:0 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.spk:active{background:var(--accent-soft)}
.spk .wv{opacity:.95}
.spk.playing{color:var(--accent-text)}
.spk.playing .wv1{animation:wave 1s ease-in-out infinite}
.spk.playing .wv2{animation:wave 1s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- 文章列表（每篇文章结尾） ---------- */
.toc{margin:40px 0 0}
.toc h3{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--muted)}
.toc-g{margin:0 0 18px}
.toc-gh{margin:0 0 8px 2px;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--faint)}
.toc-i{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:baseline;width:100%;margin:0 0 8px;
  padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.toc-i:active{background:var(--accent-soft)}
.toc-l{grid-row:span 2;min-width:22px;font:600 12px/1.6 var(--sans);color:var(--faint);white-space:nowrap}
.toc-t{font:italic 600 16px/1.35 var(--serif);color:var(--text)}
.toc-z{font-size:13px;line-height:1.5;color:var(--muted)}
.toc-i.cur{box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.toc-i.cur .toc-l{color:var(--accent-text)}

/* ---------- 单词小气泡：在词的上方（顶上放不下就在下方），尖角对准这个词 ---------- */
.tip{position:absolute;z-index:40;max-width:min(280px,calc(100vw - 16px));padding:6px 12px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font:600 16px/1.45 var(--sans);
  box-shadow:0 6px 18px rgba(40,44,120,.28);animation:pop .15s ease-out}
.tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:10px;height:10px;margin-left:-5px;
  background:inherit;transform:rotate(45deg)}
.tip.below::after{top:-5px;bottom:auto}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));z-index:50;transform:translate(-50%,10px);max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;line-height:1.5;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar" id="bar"><h1 id="barTitle"></h1></header>
<main id="main"></main>
<div class="tip" id="tip" lang="zh-CN" hidden></div>
<div class="toast" id="toast" role="status"></div>

<!-- 文章目录 和 单词录音表；每篇文章的内容（articles/*.js）和录音时间（audio/*/timings.js）打开时再加载 -->
<script src="articles/index.js"></script>
<script src="audio/words.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const APP = window.AndroidApp || null;   // 在 Android 应用里运行（见 android/）
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RATE = 0.8;                        // 朗读速度固定 0.8×（整句和单词都是）
const SAY_ALL = {                        // 全书通用的读法；每篇文章可以在 say 里补充
  'Dr': 'Doctor', '&': 'and', 'A-Z': 'A to Z', 'e.g': 'for example', 'i.e': 'that is',
  'km': 'kilometers', 'kms': 'kilometers', 'cm': 'centimeters', 'mm': 'millimeters', 'kg': 'kilograms',
};
const LIST = self.ARTICLES || [];        // [{ id, group, label, title, zh }]
const WORDS = self.WORD_AUDIO || {};     // 单词（小写）-> audio/words/ 里的读音文件

/* ================= 文章数据 =================
   articles/<id>.js 调用 ARTICLE({ id, say, title, paras })：
     title 和每一句都是 [英文, 中文, 词义, 读法替换(可选)]；_斜体_ 标记书名。
     词义是「英文词=中文」，用空格隔开，按词在句中出现的顺序，中文只从这一句的译文里原样摘取；
     没写的词点了只发音。读法替换只影响发音（旧拼写、人名、日期等），不影响显示。 */
const store = {};                        // id -> { data, timings, built }
self.ARTICLE = a => { (store[a.id] = store[a.id] || {}).data = a; };
self.TIMINGS = (id, t) => { (store[id] = store[id] || {}).timings = t; };

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('加载失败：' + src));
    document.head.appendChild(s);
  });
}

/* ================= 解析 ================= */
function parseUnit(raw, say, over) {
  const toks = [], parts = raw.split(/\s+/);
  let italicOn = false, speech = '';
  parts.forEach((t, n) => {
    let italic = italicOn;
    if (t.includes('_')) {
      if (/^[^\p{L}\p{N}£$&]*_/u.test(t)) { italicOn = true; italic = true; }
      if (/_[^\p{L}\p{N}]*$/u.test(t)) italicOn = false;
      t = t.replace(/_/g, '');
    }
    const m = t.match(/^([^\p{L}\p{N}£$&]*)(.*?)([^\p{L}\p{N}%&]*)$/u);
    const lead = m[1], core = m[2], trail = m[3];
    if (speech) speech += ' ';
    const start = speech.length;
    if (!core) {                         // 单独的破折号等
      speech += ',';
    } else {
      const s = (over && over[core]) || say[core] || core;
      const clean = x => x.replace(/[‘’“”"']/g, '');
      let tr = clean(trail);
      // 缩写换成整词读（e.g. -> for example）时，句中缩写点不读成句号
      if (s !== core && core.includes('.') && tr[0] === '.' && n < parts.length - 1) tr = tr.slice(1);
      speech += clean(lead) + s.replace(/’/g, "'") + tr;
    }
    toks.push({ lead, core, trail, italic, start });
  });
  return { toks, speech };
}

const normWord = w => w.replace(/’/g, "'").toLowerCase();

// 把「英文词=中文」挂到对应的词上（tok.gloss）；对不上的记进 errors，测试会检查
function applyGloss(u, gloss, errors, where) {
  let j = 0;
  for (const pair of (gloss || '').split(/\s+/).filter(Boolean)) {
    const [en, zh] = pair.split('='), from = j;
    while (j < u.toks.length && normWord(u.toks[j].core) !== normWord(en)) j++;
    if (j === u.toks.length || !zh || !u.zh.includes(zh)) { errors.push(`${where}：${pair}`); j = from; continue; }
    u.toks[j++].gloss = zh;
  }
}

function buildArticle(a) {
  const say = Object.assign({}, SAY_ALL, a.say), units = [], errors = [];
  const add = ([en, zh, gloss, over], p) => {
    const u = { p, en: en.replace(/_/g, ''), zh, ...parseUnit(en, say, over) };
    applyGloss(u, gloss, errors, `${a.id} ${units.length ? '第 ' + units.length + ' 句' : '标题'}`);
    units.push(u);
  };
  add(a.title, -1);                      // units[0] 是标题
  a.paras.forEach((para, p) => para.forEach(row => add(row, p)));
  return { id: a.id, units, say, errors };
}

async function ensure(id) {
  if (!(store[id] && store[id].data)) await loadScript(`articles/${id}.js`);
  if (!store[id].timings) await loadScript(`audio/${id}/timings.js`).catch(() => {});
  if (!store[id].built) store[id].built = buildArticle(store[id].data);
  return store[id].built;
}

/* ================= 显示 ================= */
let A = null;                            // 当前文章
const uEl = i => $('u' + i);
const ICON_SPK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.8 9.4h3.4l4.5-3.9a.6.6 0 0 1 1 .45v12.1a.6.6 0 0 1-1 .45l-4.5-3.9H3.8a.8.8 0 0 1-.8-.8V10.2a.8.8 0 0 1 .8-.8z" fill="currentColor" stroke="none"/><path class="wv wv1" d="M15.6 9.3a4 4 0 0 1 0 5.4"/><path class="wv wv2" d="M18.3 6.6a7.9 7.9 0 0 1 0 10.8"/></svg>';

const wordsHtml = u => u.toks.map((t, k) => t.core
  ? `<span class="w" data-k="${k}">${esc(t.lead)}<span class="u">${t.italic ? '<i>' : ''}${esc(t.core)}${t.italic ? '</i>' : ''}</span>${esc(t.trail)}</span>`
  : esc(t.lead + t.trail)).join(' ');
const footHtml = (u, i) => `<div class="foot">
      <p class="zh" lang="zh-CN">${esc(u.zh)}</p>
      <button class="spk" aria-label="${i ? `朗读第${i}句` : '朗读标题'}">${ICON_SPK}</button>
    </div>`;

function tocHtml(cur) {
  let html = '<nav class="toc" aria-label="文章列表"><h3>文章列表</h3>', group = null;
  for (const a of LIST) {
    if (a.group !== group) {
      if (group !== null) html += '</div>';
      html += `<div class="toc-g"><div class="toc-gh">${esc(a.group)}</div>`;
      group = a.group;
    }
    html += `<button class="toc-i${a.id === cur ? ' cur' : ''}" data-id="${a.id}">
      <span class="toc-l">${esc(a.label)}</span><span class="toc-t" lang="en">${esc(a.title)}</span><span class="toc-z">${esc(a.zh)}</span>
    </button>`;
  }
  return html + '</div></nav>';
}

function render(art) {
  A = art;
  const [title, ...sents] = art.units;
  let html = `<section class="hero" id="u0" data-i="0">
    <h2 class="en ttl" lang="en">${wordsHtml(title)}</h2>
    ${footHtml(title, 0)}
  </section>`, lastP = -1;
  sents.forEach((s, j) => {
    const i = j + 1;
    if (s.p !== lastP) { html += (lastP >= 0 ? '</section>' : '') + '<section class="para">'; lastP = s.p; }
    html += `<article class="s" id="u${i}" data-i="${i}">
      <div class="num">${i}</div>
      <div>
        <p class="en" lang="en">${wordsHtml(s)}</p>
        ${footHtml(s, i)}
      </div>
    </article>`;
  });
  $('main').innerHTML = html + '</section>' + tocHtml(art.id);
  $('barTitle').textContent = title.en;
  document.title = title.en;
  cur = -1;
}

async function openArticle(id) {
  stop();
  hideTip();
  try {
    render(await ensure(id));
  } catch (e) {
    toast(String(e.message || e), 4000);
    return;
  }
  scrollTo(0, 0);
  onScroll();
}

/* ================= Toast ================= */
let toastT = 0;
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= 录音（内置美式英语） =================
   audio/<文章>/00.mp3 是标题，01.mp3… 是每句；audio/words/ 里每个单词一个 mp3。
   都是用 Kokoro 美式英语发音人预先生成的（见 tools/audio），不依赖手机自带的语音引擎；
   audio/<文章>/timings.js 记录每句中每个词开始的时间，用来逐词高亮。 */
const player = new Audio();
const urls = new Map();     // 路径 -> Promise<blob URL>：整段先读进内存再播，安卓 WebView 里更稳
const wordSay = (t, say) => ((say || A.say)[t.core] || t.core).replace(/’/g, "'");   // 单词单独怎么读（不用整句里的特殊读法）
const wordKey = (t, say) => wordSay(t, say).toLowerCase();

function blobUrl(path) {
  if (!urls.has(path)) {
    const p = fetch(path).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b));
    p.catch(() => urls.delete(path));
    urls.set(path, p);
  }
  return urls.get(path);
}

/* ================= 播放 ================= */
let stopAudio = null;   // 正在播放的那段：调用它立即结束
let litTok = null;

function lightTok(i, k) {
  const el = k == null || !uEl(i) ? null : uEl(i).querySelector(`.w[data-k="${k}"]`);
  if (el === litTok) return;
  if (litTok) litTok.classList.remove('on');
  litTok = el;
  if (el) el.classList.add('on');
}
function tokAtChar(u, ci) {
  let k = null;
  for (let j = 0; j < u.toks.length; j++) { if (u.toks[j].start <= ci) { if (u.toks[j].core) k = j; } else break; }
  return k;
}

function stop() {
  player.pause();
  if (stopAudio) stopAudio();
}

/** 播放一段录音；给了 marks（整句）就跟着逐词高亮。结束或被打断时调 onEnd。 */
function playClip(path, i, marks, onEnd) {
  stop();
  const u = A.units[i];
  let done = false, raf = 0;
  const finish = () => {
    if (done) return; done = true;
    cancelAnimationFrame(raf);
    player.onended = player.onerror = null;
    if (stopAudio === finish) stopAudio = null;
    if (marks) lightTok(i, null);
    onEnd();
  };
  stopAudio = finish;
  const follow = () => {
    const t = player.currentTime;
    let j = -1;
    while (j + 1 < marks.length && marks[j + 1][1] <= t) j++;
    lightTok(i, j < 0 ? null : tokAtChar(u, marks[j][0]));
    raf = requestAnimationFrame(follow);
  };
  blobUrl(path).then(url => {
    if (done) return;
    player.src = url;
    player.playbackRate = RATE;
    player.onended = finish;
    player.onerror = () => { toast('录音播放出错'); finish(); };
    return player.play().then(() => { if (!done && marks) follow(); });
  }).catch(e => {
    if (!done) toast('录音播放失败（' + (e && e.message || e) + '）', 4000);
    finish();
  });
}

/** 小喇叭：读整句（或标题）英文；正在读时再点一次就停。 */
function playUnit(i) {
  const spk = uEl(i).querySelector('.spk');
  if (spk.classList.contains('playing')) { stop(); return; }
  hideTip();
  setCur(i);
  const t = store[A.id].timings && store[A.id].timings[i];
  if (!t) { toast('没有这句的录音'); return; }
  spk.classList.add('playing');
  playClip(`audio/${A.id}/${t.file}`, i, t.marks, () => spk.classList.remove('playing'));
}

/** 点单词：只读这个词；这个词在本句译文里有对应的中文，就在词旁弹出小气泡。 */
function tapWord(i, k, el) {
  const t = A.units[i].toks[k];
  hideTip();
  selWord = el;
  el.classList.add('sel');
  setCur(i);
  if (t.gloss) showTip(el, t.gloss);
  const file = WORDS[wordKey(t)];
  if (file) playClip('audio/words/' + file, i, null, () => {});
  else stop();
}

/* ================= 单词小气泡 ================= */
const tip = $('tip');
let selWord = null;

function showTip(wordEl, text) {
  tip.textContent = text;
  tip.hidden = false;
  const r = wordEl.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const cx = r.left + r.width / 2;
  const left = Math.max(8, Math.min(innerWidth - w - 8, cx - w / 2));
  const above = r.top - h - 10 >= $('bar').getBoundingClientRect().bottom;   // 顶上被标题栏挡住就放到词下方
  tip.classList.toggle('below', !above);
  tip.style.left = (left + scrollX) + 'px';
  tip.style.top = ((above ? r.top - h - 10 : r.bottom + 10) + scrollY) + 'px';
  tip.style.setProperty('--ax', (cx - left) + 'px');                          // 尖角对准这个词
}
function hideTip() {
  tip.hidden = true;
  if (selWord) selWord.classList.remove('sel');
  selWord = null;
}
addEventListener('resize', hideTip);

let cur = -1;                            // 正在读或刚点过的句子（卡片左边一条蓝线）
function setCur(i) {
  if (cur > 0 && uEl(cur)) uEl(cur).classList.remove('cur');
  cur = i;
  if (i > 0) uEl(i).classList.add('cur');
}

/* ================= 交互 ================= */
document.addEventListener('click', e => {
  const item = e.target.closest('.toc-i');
  if (item) { openArticle(item.dataset.id); return; }
  const unit = e.target.closest('[data-i]');
  if (unit && e.target.closest('.spk')) { playUnit(+unit.dataset.i); return; }
  const w = unit && e.target.closest('.w');
  if (w) { tapWord(+unit.dataset.i, +w.dataset.k, w); return; }
  hideTip();                                          // 点气泡或空白处收起
});

/* ---- 顶栏阴影 ---- */
const onScroll = () => $('bar').classList.toggle('scrolled', window.scrollY > 60);
addEventListener('scroll', onScroll, { passive: true });

/* ---- 每次打开都从第一篇的第一行开始：切到后台超过 5 分钟再回来也一样 ---- */
const AWAY_MS = 5 * 60 * 1000;
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); hiddenAt = Date.now(); }
  else if (hiddenAt && Date.now() - hiddenAt > AWAY_MS) openArticle(LIST[0].id);
});
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

/* ================= 离线缓存（网页版；应用里文件本来就在手机上） ================= */
if (!APP && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ================= 启动 ================= */
const ready = LIST.length ? openArticle(LIST[0].id) : Promise.resolve();

// 测试钩子
window.__reader = {
  LIST, WORDS, player, store, ready, openArticle, ensure, wordSay, wordKey,
  get art() { return A; },
  get state() { return { id: A && A.id, cur, tip: tip.hidden ? null : tip.textContent }; },
  async loadAll() { const out = []; for (const a of LIST) out.push(await ensure(a.id)); return out; },
};
})();
</script>
</body>
